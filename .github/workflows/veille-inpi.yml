name: Veille INPI — marque « Allo Frelons »

# Interroge tous les jours la base Marques de l'INPI et envoie un courriel dès
# qu'un nouveau dépôt contenant « Allo Frelons » apparaît.
#
# Pré-requis : définir les secrets suivants dans les réglages du dépôt GitHub
#   (Settings → Secrets and variables → Actions → New repository secret) :
#     SMTP_HOST      : serveur d'envoi (ex. smtp.gmail.com)
#     SMTP_PORT      : 465 (SSL) ou 587 (STARTTLS) — facultatif, 465 par défaut
#     SMTP_USER      : identifiant SMTP (ex. allofrelons@gmail.com)
#     SMTP_PASSWORD  : mot de passe d'application (Gmail : compte Google →
#                      Sécurité → Validation en deux étapes → Mots de passe
#                      d'application). Jamais le mot de passe du compte.
#     MAIL_TO        : destinataire — facultatif (allofrelons@gmail.com par défaut)
#   Facultatif, pour utiliser l'API officielle plutôt que la recherche publique :
#     INPI_API_USERNAME / INPI_API_PASSWORD (compte technique créé depuis
#     data.inpi.fr → « Mes accès API / SFTP » → « Accès APIs PI »)
#
# La liste des marques déjà connues est conservée dans
# `outils/etat-veille-inpi.json`, committé automatiquement après chaque passage.

on:
  schedule:
    # Tous les jours à 6 h 17 UTC (≈ 8 h 17 en heure d'été française).
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      init:
        description: "Initialiser : enregistrer les dépôts existants sans envoyer d'alerte"
        type: boolean
        default: false
      test_courriel:
        description: "Envoyer un courriel de test (vérification de la configuration SMTP)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veille-inpi
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Interroger l'INPI et alerter
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          INPI_API_USERNAME: ${{ secrets.INPI_API_USERNAME }}
          INPI_API_PASSWORD: ${{ secrets.INPI_API_PASSWORD }}
          VEILLE_TERMES: ${{ vars.VEILLE_TERMES }}
        run: |
          if [ "${{ inputs.test_courriel }}" = "true" ]; then
            node outils/veille-inpi.mjs --test-courriel
          elif [ "${{ inputs.init }}" = "true" ]; then
            node outils/veille-inpi.mjs --init
          else
            node outils/veille-inpi.mjs
          fi

      - name: Mémoriser les marques déjà vues
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain outils/etat-veille-inpi.json)" ]; then
            git add outils/etat-veille-inpi.json
            git commit -m "Veille INPI : mise à jour des marques suivies"
            git push
          else
            echo "État inchangé, rien à committer."
          fi
