name: Annuaire — collecte quotidienne

# Cycle de vie quotidien de l'annuaire :
#   1. collecte  : N nouvelles entreprises sans site web déclaré sur leur GMB ;
#   2. backlinks : relecture des fiches Google et mise à jour de l'état des liens ;
#   3. retraits  : application des 301 / 410 aux fiches dont le lien a disparu.
#
# Les fiches sont committées : le dépôt Git est la mémoire de l'annuaire, et
# chaque changement (publication, perte de lien, retrait) est relisible en diff.
#
# Le déploiement est ensuite déclenché EXPLICITEMENT (workflow_dispatch) :
# un push effectué avec le GITHUB_TOKEN ne déclenche jamais les workflows
# « on: push » (règle GitHub anti-boucle). Sans cet appel, les fiches
# collectées ne sont jamais mises en ligne et leurs URLs répondent 404.
#
# Secrets attendus :
#   GOOGLE_PLACES_API_KEY  clé de l'API Google Places (New)
#   BREVO_API_KEY          clé Brevo pour l'envoi des emails de suggestion GMB
#   GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT  compte de service (JSON base64) — optionnel,
#                          seulement si Workload Identity (env ci-dessous) n'est pas utilisé

on:
  schedule:
    - cron: "15 5 * * *" # 05 h 15 UTC, soit 07 h 15 à Paris en été
    - cron: "15 10 * * *" # 10 h 15 UTC (12 h 15 Paris) — rattrapage si le premier run a échoué
  workflow_dispatch:
    inputs:
      fournisseur:
        description: "Fournisseur de données (google-places ou csv)"
        required: false
        default: "google-places"

permissions:
  contents: write
  actions: write # nécessaire pour déclencher le workflow de déploiement
  id-token: write # jeton OIDC pour s'authentifier auprès de Google sans clé

# Authentification Google sans clé (Workload Identity Federation). Les deux
# valeurs ci-dessous sont produites par annuaire/outils/installer-google.sh
# (à coller dans Cloud Shell) ; elles ne sont pas secrètes. Tant qu'elles sont
# vides, les étapes Search Console sont ignorées sans erreur.
env:
  GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ""
  GOOGLE_SERVICE_ACCOUNT: ""

concurrency:
  group: annuaire-quotidien
  cancel-in-progress: false

defaults:
  run:
    working-directory: annuaire

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: annuaire/package-lock.json

      - run: npm ci

      - name: Collecter les nouvelles entreprises
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node outils/collecte.mjs --fournisseur=${{ inputs.fournisseur || 'google-places' }}

      - name: Vérifier les backlinks Google Business Profile
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node outils/backlinks.mjs

      # Jeton d'accès Google obtenu par échange du jeton OIDC de GitHub : aucune
      # clé n'est stockée nulle part. Portées : Search Console + vérification de site.
      - name: S'authentifier auprès de Google (Workload Identity)
        id: google
        if: env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters,https://www.googleapis.com/auth/siteverification
          create_credentials_file: false

      # Mise en place automatique de l'accès Search Console (vérification du
      # site, déclaration de la propriété, copropriétaires). Idempotent.
      - name: Préparer l'accès Search Console
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
        run: node outils/search-console.mjs

      # Relevé Search Console : clics et impressions des 90 derniers jours par
      # page. Ignoré sans erreur si aucune authentification n'est disponible.
      - name: Relever l'audience Search Console
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
        run: node outils/audience.mjs

      # Inspection d'indexation : les pages assez âgées sans impression sont
      # soumises à l'API d'inspection d'URL. Ignoré sans authentification.
      - name: Inspecter l'indexation des pages
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
        run: node outils/couverture.mjs

      - name: Appliquer les retraits (301 / 410)
        run: node outils/retraits.mjs

      - name: Synchroniser les suggestions marquées depuis le serveur
        run: node outils/suggestions.mjs --sync

      - name: Envoyer les emails de suggestion GMB
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node outils/email-suggestions.mjs

      - name: Résumé
        run: node outils/etat.mjs

      - name: Committer l'état de l'annuaire
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain donnees)" ]; then
            git add donnees
            git commit -m "Annuaire : cycle quotidien du $(date -u +%F)"
            git push
            echo "modifie=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun changement à committer."
            echo "modifie=non" >> "$GITHUB_OUTPUT"
          fi

      # Un push signé par le GITHUB_TOKEN ne déclenche pas « on: push » ;
      # seuls workflow_dispatch et repository_dispatch échappent à cette règle.
      # On lance donc le déploiement à la main, uniquement si l'état a changé.
      - name: Déclencher le déploiement
        if: steps.commit.outputs.modifie == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run annuaire-deploiement.yml --repo "$GITHUB_REPOSITORY" --ref main
